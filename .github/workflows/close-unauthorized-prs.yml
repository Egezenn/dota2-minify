name: Close unauthorized pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: Check contributor allowlist
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login.toLowerCase();

            let content;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".github/contrib.txt",
                ref: pr.base.sha,
              });
              content = Buffer.from(data.content, "base64").toString("utf8");
            } catch (error) {
              core.setFailed(`Unable to read .github/contrib.txt: ${error.message}`);
              return;
            }

            const allowed = content
              .split(/\r?\n/)
              .map((name) => name.trim().toLowerCase())
              .filter(Boolean);

            if (allowed.includes(author)) {
              core.info(`@${pr.user.login} is an approved contributor.`);
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `This repository only accepts pull requests from approved contributors, so this pull request was closed automatically.\n\nIf you believe this is a mistake, please contact a maintainer.`,
              });
            } catch (error) {
              core.warning(`Closed pull request #${pr.number}, but failed to comment: ${error.message}`);
            }

            core.info(`Closed pull request #${pr.number} from @${pr.user.login}.`);
