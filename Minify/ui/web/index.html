<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dota 2 Minify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --loader-bg: #ffffff;
        --loader-color: #17bebe;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --loader-bg: #0b0f19;
        }
      }
      #app {
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
      }
      body.loaded #app {
        opacity: 1;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--loader-bg);
        z-index: 99999;
        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
      }
      #loading-screen.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(128, 128, 128, 0.2);
        border-top-color: var(--loader-color);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var themeUrl = localStorage.getItem("minify-theme-url");
          if (themeUrl) {
            var link = document.createElement("link");
            link.id = "minify-theme-link";
            link.rel = "stylesheet";
            link.href = themeUrl;
            document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
